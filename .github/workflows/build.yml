name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: brew install xcodegen
      - name: Secretos
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
          L: ${{ secrets.LOG_TOKEN }}
        run: |
          printf 'enum Secrets { static let gemini = "%s"; static let log = "%s" }\n' "$K" "$L" > Sources/Secrets.swift
      - name: Proyecto
        run: xcodegen generate
      - name: Compilar
        run: |
          xcodebuild -project Jarvis.xcodeproj -scheme Jarvis -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Jarvis.app Payload/
          zip -qr Jarvis.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-ipa
          path: Jarvis.ipa
