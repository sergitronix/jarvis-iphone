name: Jarvis
options:
  bundleIdPrefix: com.sergio
targets:
  Jarvis:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Jarvis necesita el micrófono para escucharte.
        NSCameraUsageDescription: Jarvis usa la cámara para ver lo que le enseñas.
        NSLocationWhenInUseUsageDescription: Jarvis usa tu ubicación para el mapa y para ayudarte.
        NSSpeechRecognitionUsageDescription: Jarvis usa el reconocimiento de voz para entenderte.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergio.jarvisphone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
